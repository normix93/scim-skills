name: Refresh generated data

# Monthly: the RFCs do not change, but the generator and its corrections may; rebuild and open a PR if the
# generated files differ.
on:
  schedule:
    - cron: "17 5 3 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/build_data.py
      - name: Ignore date-only changes
        run: |
          for f in $(git diff --name-only); do
            if [ -z "$(git diff -U0 "$f" | grep '^[+-]' | grep -v '^+++\|^---' | grep -v 'GENERATED by tools/')" ]; then
              git checkout -- "$f"
            fi
          done
      - run: python3 -m unittest discover -s tests
      - uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/refresh-data
          commit-message: "chore: refresh generated SCIM data"
          title: "chore: refresh generated SCIM data"
          body: "Automated rebuild of skills/scim/scripts/scim_schema.json and references/schemas.md."
          delete-branch: true
